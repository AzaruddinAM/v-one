# Deploys the AI edition of v-one to https://velouraone.in/chatboat over FTP.
#
#   frontend → <FTP_REMOTE_DIR>/chatboat/        (Angular, base href /chatboat/)
#   backend  → <FTP_REMOTE_DIR>/backend/core/    (app/, config/, routes/ only — .env, vendor/, storage/ are never touched)
#
# Modes (Actions → Deploy /chatboat → Run workflow → mode); pushes always use "changed":
#   changed  only files changed since the last deploy; deleted files are removed on the server
#   full     replace everything (whole frontend build + backend app/, config/, routes/)
# Logic lives in deploy/ftp-deploy-chatboat.sh.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   FTP_HOST        e.g. ftp.velouraone.in  (hPanel → Files → FTP Accounts)
#   FTP_USER        FTP username
#   FTP_PASSWORD    FTP password
# Optional:
#   FTP_REMOTE_DIR  folder that holds the site, relative to the FTP login folder
#                   (default: auto-detected — ".", "public_html" or "domains/velouraone.in/public_html")
name: Deploy /chatboat

# Manual only: pushes now deploy accounts.velouraone.in (deploy-accounts.yml).
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'changed = only files changed since the last deploy · full = replace everything'
        type: choice
        options: [changed, full]
        default: changed

concurrency:
  group: deploy-chatboat
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, bcmath
      - name: Backend tests
        working-directory: backend
        run: |
          composer install --no-interaction --no-progress
          cp .env.example .env
          php artisan key:generate
          php artisan test
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend tests
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USER: ${{ secrets.FTP_USER }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR }}
      MODE: ${{ inputs.mode || 'changed' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, to diff against the last deployed commit

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Work out what to deploy (${{ inputs.mode || 'changed' }})
        id: plan
        run: bash deploy/ftp-deploy-chatboat.sh plan

      - uses: actions/setup-node@v4
        if: steps.plan.outputs.frontend == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build Angular for /chatboat/
        if: steps.plan.outputs.frontend == 'true'
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx ng build --configuration production --base-href /chatboat/ --output-path dist/chatboat
          cp ../deploy/templates/chatboat.htaccess dist/chatboat/browser/.htaccess

      - name: Upload over FTP
        run: bash deploy/ftp-deploy-chatboat.sh upload

      - name: Smoke test
        run: |
          sleep 5
          curl -fsS https://velouraone.in/backend/api/health
          curl -fsS -o /dev/null -w "chatboat %{http_code}\n" https://velouraone.in/chatboat/
          code=$(curl -s -o /dev/null -w "%{http_code}" -H "Accept: application/json" https://velouraone.in/backend/api/ai/status)
          echo "ai/status → $code (401 = route exists, needs login)"
          [ "$code" = "401" ]
