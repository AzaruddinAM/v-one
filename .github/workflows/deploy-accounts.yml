# Deploys VelouraOne to https://accounts.velouraone.in (Hostinger) over SSH.
#
#   frontend → <DEPLOY_PATH>/                 (Angular production build)
#   backend  → <DEPLOY_PATH>/backend/core/    (Laravel incl. vendor/; .env, storage/ and .htaccess are never touched)
#
# Every deploy first backs up the live database and code to ~/backups/accounts/ on the server,
# then runs `php artisan migrate --force`. Logic lives in deploy/ssh-deploy-accounts.sh.
#
# The only deploy for VelouraOne. Runs on every push to feature/gemini-ai-assistant, or by hand: Actions → Deploy accounts → Run workflow.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   SSH_HOST   server IP from hPanel → Advanced → SSH Access
#   SSH_USER   SSH username (u480307718)
#   SSH_KEY    private deploy key whose public half is added in hPanel → SSH Access → SSH keys
# Optional:
#   SSH_PORT     default 65002 (Hostinger)
#   DEPLOY_PATH  site folder on the server (auto-detected: ~/domains/accounts.velouraone.in/public_html, …)
#   PHP_BIN      PHP 8.3+ CLI on the server (auto-detected)
name: Deploy accounts

on:
  push:
    branches: [feature/gemini-ai-assistant]
  workflow_dispatch:
    inputs:
      action:
        description: 'deploy = back up, upload and migrate · check = only connect and show migration status'
        type: choice
        options: [deploy, check]
        default: deploy

concurrency:
  group: deploy-accounts
  cancel-in-progress: false

jobs:
  test:
    if: (inputs.action || 'deploy') == 'deploy'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, bcmath
      - name: Backend tests
        working-directory: backend
        run: |
          composer install --no-interaction --no-progress
          cp .env.example .env
          php artisan key:generate
          php artisan test
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend tests
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm test

  deploy:
    needs: test
    if: always() && (needs.test.result == 'success' || needs.test.result == 'skipped')
    runs-on: ubuntu-latest
    environment: production
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_KEY: ${{ secrets.SSH_KEY }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      PHP_BIN: ${{ secrets.PHP_BIN }}
    steps:
      - uses: actions/checkout@v4

      - name: Check server connection
        if: inputs.action == 'check'
        run: bash deploy/ssh-deploy-accounts.sh check

      - uses: shivammathur/setup-php@v2
        if: inputs.action != 'check'
        with:
          php-version: '8.3'
      - name: Install backend dependencies (no dev)
        if: inputs.action != 'check'
        working-directory: backend
        run: composer install --no-dev --optimize-autoloader --no-interaction --no-progress

      - uses: actions/setup-node@v4
        if: inputs.action != 'check'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build Angular (production)
        if: inputs.action != 'check'
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx ng build --configuration production

      - name: Back up, upload and migrate
        if: inputs.action != 'check'
        run: bash deploy/ssh-deploy-accounts.sh deploy

      - name: Smoke test
        if: inputs.action != 'check'
        run: |
          sleep 5
          curl -fsS https://accounts.velouraone.in/backend/api/health; echo
          curl -fsS -o /dev/null -w "app %{http_code}\n" https://accounts.velouraone.in/
          code=$(curl -s -o /dev/null -w "%{http_code}" -H "Accept: application/json" https://accounts.velouraone.in/backend/api/auth/me)
          echo "api/auth/me → $code (401 = API up, needs login)"
          [ "$code" = "401" ]
